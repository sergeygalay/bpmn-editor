<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BPMN 2.0 Editor</title>

  <link rel="stylesheet" href="https://unpkg.com/bpmn-js@18.24.0/dist/assets/diagram-js.css">
  <link rel="stylesheet" href="https://unpkg.com/bpmn-js@18.24.0/dist/assets/bpmn-js.css">
  <link rel="stylesheet" href="https://unpkg.com/bpmn-js@18.24.0/dist/assets/bpmn-font/css/bpmn.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="toolbar">
    <div class="brand">
      <strong>BPMN 2.0 Editor</strong>
      <span id="model-name">Покупка в магазине</span>
    </div>
    <div class="actions">
      <button id="reload" type="button">Обновить из GitHub</button>
      <button id="undo" type="button" title="Отменить">↶</button>
      <button id="redo" type="button" title="Повторить">↷</button>
      <button id="fit" type="button">Вписать</button>
      <button id="zoom-out" type="button">−</button>
      <button id="zoom-in" type="button">+</button>
    </div>
  </header>

  <main>
    <div id="canvas"></div>
    <div id="status" class="status">Загрузка BPMN…</div>
  </main>

  <script src="https://unpkg.com/bpmn-js@18.24.0/dist/bpmn-modeler.development.js"></script>
  <script src="app.js"></script>
</body>
</html>
